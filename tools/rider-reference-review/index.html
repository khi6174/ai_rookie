<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>SafeRoute 기사 운행·제품 경계 익명 검토</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">SR</div>
      <div>
        <strong>SafeRoute 기사 운행 화면</strong>
        <span>경로·제품 경계 이해도 검토 · 합성 Demo</span>
      </div>
      <span class="demo-badge">연구용 · Live 아님</span>
    </header>

    <main id="app" class="app-shell" aria-live="polite"></main>

    <template id="intro-template">
      <section class="intro-card">
        <p class="eyebrow">독립 검토 <span data-reviewer-number></span>/5</p>
        <h1>기사 운행 화면을 보고 현재 상황과 제품 역할을 찾아주세요.</h1>
        <p>화면은 한 번만 답합니다. 정답은 다섯 명의 검토가 끝날 때까지 표시하지 않습니다.</p>
        <div class="notice-grid">
          <article><strong>수집하지 않음</strong><span>실명, 연락처, 소속, 실제 기사·위치 정보</span></article>
          <article><strong>기록함</strong><span>익명 답변, 완료시간, 이해 확신</span></article>
          <article><strong>자료 성격</strong><span>고정 합성 Demo이며 실제 GPS·내비게이션·센서가 아님</span></article>
        </div>
        <label class="consent-row">
          <input type="checkbox" data-consent />
          <span>위 내용을 이해했으며 익명 응답을 평가 증거로 보존하는 데 동의합니다.</span>
        </label>
        <p class="privacy-note">이름, 연락처 또는 소속을 입력하지 마세요.</p>
        <button type="button" class="primary-button" data-start disabled>검토 시작</button>
      </section>
    </template>

    <template id="trial-template">
      <section class="trial-layout rider-review-layout">
        <div class="trial-heading">
          <div>
            <p class="eyebrow">익명 검토 <span data-reviewer-label></span></p>
            <h1>화면에서 확인한 내용만 답해주세요.</h1>
          </div>
          <span class="timer-state" data-timer-state>화면 준비 중</span>
        </div>
        <figure class="stimulus-card rider-stimulus-card">
          <img data-stimulus alt="SafeRoute 기사 운행 합성 Demo 화면" />
          <figcaption>390×844 고정 합성 Demo · 실제 GPS·길안내·운영 데이터 아님</figcaption>
        </figure>
        <form class="question-card" data-trial-form>
          <fieldset>
            <legend>1. 현재 운행 중인 구간은 어디인가요?</legend>
            <div class="choice-grid">
              <label><input required type="radio" name="currentSegment" value="FOURTEENTH_DELIVERY_SEGMENT" />14번째 배송지 구간</label>
              <label><input type="radio" name="currentSegment" value="OTHER" />다른 배송지 구간</label>
              <label><input type="radio" name="currentSegment" value="UNKNOWN" />화면에서 알 수 없음</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>2. 다음 안전 거점은 무엇인가요?</legend>
            <div class="choice-grid">
              <label><input required type="radio" name="nextSafetyStop" value="TEN_MINUTE_REST" />10분 휴식 지점</label>
              <label><input type="radio" name="nextSafetyStop" value="NEXT_DELIVERY_ONLY" />다음 배송지만 표시됨</label>
              <label><input type="radio" name="nextSafetyStop" value="UNKNOWN" />화면에서 알 수 없음</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>3. 언제까지 안전지원을 확인해야 하나요?</legend>
            <div class="choice-grid">
              <label><input required type="radio" name="supportBoundary" value="BEFORE_SEVENTEENTH_DELIVERY" />17번째 배송지 전</label>
              <label><input type="radio" name="supportBoundary" value="AFTER_SEVENTEENTH_DELIVERY" />17번째 배송지 이후</label>
              <label><input type="radio" name="supportBoundary" value="UNKNOWN" />화면에서 알 수 없음</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>4. 이 화면에서 SafeRoute의 역할은 무엇인가요?</legend>
            <div class="choice-grid single-column">
              <label><input required type="radio" name="productRole" value="SAFETY_OPERATION_DECISION_LAYER" />미래 위험을 예측하고 지원계획을 합의하는 안전운영 의사결정</label>
              <label><input type="radio" name="productRole" value="LIVE_NAVIGATION_AND_DISPATCH" />실시간 길안내와 오더 배차</label>
              <label><input type="radio" name="productRole" value="ACCIDENT_DETECTION_AND_RESCUE" />사고 자동 감지와 구조 요청</label>
              <label><input type="radio" name="productRole" value="UNKNOWN" />화면에서 알 수 없음</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>5. 제안된 지원계획은 언제 적용되나요?</legend>
            <div class="choice-grid single-column">
              <label><input required type="radio" name="approvalRule" value="RIDER_AND_ADMIN_REQUIRED" />필요한 기사 동의와 관리자 승인 후</label>
              <label><input type="radio" name="approvalRule" value="AUTOMATIC_APPLY" />AI 추천 즉시 자동 적용</label>
              <label><input type="radio" name="approvalRule" value="ADMIN_ONLY" />기사 확인 없이 관리자 승인만으로 적용</label>
              <label><input type="radio" name="approvalRule" value="UNKNOWN" />화면에서 알 수 없음</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>6. 현재 지도와 위치 데이터의 상태는 무엇인가요?</legend>
            <div class="choice-grid single-column">
              <label><input required type="radio" name="demoBoundary" value="DEMO_ROUTE_NO_LIVE_GPS" />합성 Demo 경로이며 실제 GPS·턴바이턴이 아님</label>
              <label><input type="radio" name="demoBoundary" value="LIVE_GPS_TURN_BY_TURN" />실제 GPS 기반 실시간 턴바이턴</label>
              <label><input type="radio" name="demoBoundary" value="UNKNOWN" />화면에서 알 수 없음</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>7. 이 화면만 보고 이해한 확신은 어느 정도인가요?</legend>
            <div class="confidence-row">
              <label><input required type="radio" name="confidence" value="1" />1</label>
              <label><input type="radio" name="confidence" value="2" />2</label>
              <label><input type="radio" name="confidence" value="3" />3</label>
              <label><input type="radio" name="confidence" value="4" />4</label>
              <label><input type="radio" name="confidence" value="5" />5</label>
            </div>
          </fieldset>
          <label class="comment-label"><span>이유 또는 혼란 지점(선택, 500자 이내)</span><textarea name="comment" maxlength="500" rows="4" placeholder="실명·연락처·소속은 입력하지 마세요."></textarea></label>
          <button class="primary-button" type="submit">익명 답변 저장</button>
        </form>
      </section>
    </template>

    <template id="handoff-template">
      <section class="intro-card handoff-card">
        <p class="eyebrow">응답 저장 완료</p>
        <h1>다음 검토자에게 화면을 넘겨주세요.</h1>
        <p>이전 답변은 표시하지 않습니다.</p>
        <button type="button" class="primary-button" data-next-reviewer>다음 익명 검토 시작</button>
      </section>
    </template>

    <template id="complete-template">
      <section class="intro-card complete-card">
        <p class="eyebrow">5명 검토 완료</p>
        <h1>기계 검증용 익명 결과가 준비되었습니다.</h1>
        <p>결과 파일에는 익명 ID, 구조화 답변과 완료시간만 포함됩니다.</p>
        <div class="complete-actions">
          <button type="button" class="primary-button" data-download>결과 JSON 다운로드</button>
          <button type="button" class="secondary-button" data-reset>모든 로컬 응답 지우기</button>
        </div>
        <details><summary>결과 구조 확인</summary><pre data-result-json></pre></details>
      </section>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
